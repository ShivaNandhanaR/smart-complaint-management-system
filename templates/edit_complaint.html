{% extends "base.html" %}

{% block content %}

<div style="
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,0.10);
">

    <h1 style="color:#102a56; margin-bottom:10px;">
        ✏️ Edit Complaint
    </h1>

    <p style="color:#667085; margin-bottom:30px;">
        Update the complaint details below.
    </p>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <!-- CATEGORY -->

        <div style="margin-top:25px;">
            <label><b>Category</b></label>

            <select
                name="category"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin-top:8px;
                    border:1px solid #ccc;
                    border-radius:8px;
                "
            >

                <option value="Water"
                    {% if complaint.category == "Water" %}selected{% endif %}>
                    Water
                </option>

                <option value="Electricity"
                    {% if complaint.category == "Electricity" %}selected{% endif %}>
                    Electricity
                </option>

                <option value="Road"
                    {% if complaint.category == "Road" %}selected{% endif %}>
                    Road
                </option>

                <option value="Garbage"
                    {% if complaint.category == "Garbage" %}selected{% endif %}>
                    Garbage
                </option>

                <option value="Street Light"
                    {% if complaint.category == "Street Light" %}selected{% endif %}>
                    Street Light
                </option>

                <option value="Drainage"
                    {% if complaint.category == "Drainage" %}selected{% endif %}>
                    Drainage
                </option>

                <option value="Other"
                    {% if complaint.category == "Other" %}selected{% endif %}>
                    Other
                </option>

            </select>
        </div>


        <!-- LOCATION -->

        <div style="margin-top:20px;">

            <label><b>Location</b></label>

            <input
                type="text"
                name="location"
                value="{{ complaint.location }}"
                required
                style="
                    width:100%;
                    padding:12px;
                    margin-top:8px;
                    border:1px solid #ccc;
                    border-radius:8px;
                    box-sizing:border-box;
                "
            >

        </div>


        <!-- DESCRIPTION -->

        <div style="margin-top:20px;">

            <label><b>Description</b></label>

            <textarea
                name="description"
                required
                style="
                    width:100%;
                    height:150px;
                    padding:12px;
                    margin-top:8px;
                    border:1px solid #ccc;
                    border-radius:8px;
                    box-sizing:border-box;
                    resize:vertical;
                "
            >{{ complaint.description }}</textarea>

        </div>


        <!-- PRIORITY -->

        <div style="margin-top:20px;">

            <label><b>Priority</b></label>

            <select
                name="priority"
                style="
                    width:100%;
                    padding:12px;
                    margin-top:8px;
                    border:1px solid #ccc;
                    border-radius:8px;
                "
            >

                <option value="Low"
                    {% if complaint.priority == "Low" %}selected{% endif %}>
                    Low
                </option>

                <option value="Medium"
                    {% if complaint.priority == "Medium" %}selected{% endif %}>
                    Medium
                </option>

                <option value="High"
                    {% if complaint.priority == "High" %}selected{% endif %}>
                    High
                </option>

            </select>

        </div>


        <!-- IMAGE -->

        <div style="margin-top:20px;">

            <label><b>Change Image</b></label>

            <input
                type="file"
                name="image"
                accept="image/*"
                style="
                    display:block;
                    margin-top:8px;
                "
            >

        </div>


        <!-- STAFF OPTIONS -->

        {% if user.is_staff %}

        <div style="
            margin-top:30px;
            padding:25px;
            background:#f5f8ff;
            border-radius:12px;
            border:1px solid #dce6ff;
        ">

            <h3 style="color:#102a56;">
                👨‍💼 Staff Update
            </h3>


            <!-- STATUS -->

            <div style="margin-top:20px;">

                <label><b>Status</b></label>

                <select
                    name="status"
                    style="
                        width:100%;
                        padding:12px;
                        margin-top:8px;
                        border:1px solid #ccc;
                        border-radius:8px;
                    "
                >

                    <option value="Pending"
                        {% if complaint.status == "Pending" %}selected{% endif %}>
                        Pending
                    </option>

                    <option value="In Progress"
                        {% if complaint.status == "In Progress" %}selected{% endif %}>
                        In Progress
                    </option>

                    <option value="Resolved"
                        {% if complaint.status == "Resolved" %}selected{% endif %}>
                        Resolved
                    </option>

                </select>

            </div>


            <!-- ASSIGNED STAFF -->

            <div style="margin-top:20px;">

                <label><b>Assign Staff</b></label>

                <select
                    name="assigned_staff"
                    style="
                        width:100%;
                        padding:12px;
                        margin-top:8px;
                        border:1px solid #ccc;
                        border-radius:8px;
                    "
                >

                    <option value="">
                        -- Not Assigned --
                    </option>

                    {% for staff in staff_users %}

                    <option
                        value="{{ staff.id }}"
                        {% if complaint.assigned_staff_id == staff.id %}
                            selected
                        {% endif %}
                    >
                        {{ staff.username }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>

        {% endif %}


        <!-- BUTTONS -->

        <div style="
            margin-top:35px;
            display:flex;
            gap:15px;
        ">

            <button
                type="submit"
                style="
                    background:#2864e8;
                    color:white;
                    border:none;
                    padding:13px 25px;
                    border-radius:8px;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                ✓ Update Complaint
            </button>


            {% if user.is_staff %}

            <a
                href="{% url 'staff_dashboard' %}"
                style="
                    background:#eeeeee;
                    color:#333;
                    padding:13px 25px;
                    border-radius:8px;
                    text-decoration:none;
                "
            >
                ← Cancel
            </a>

            {% else %}

            <a
                href="{% url 'my_complaints' %}"
                style="
                    background:#eeeeee;
                    color:#333;
                    padding:13px 25px;
                    border-radius:8px;
                    text-decoration:none;
                "
            >
                ← Cancel
            </a>

            {% endif %}

        </div>

    </form>

</div>

{% endblock %}
