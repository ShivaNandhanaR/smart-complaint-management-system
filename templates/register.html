<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | SmartComplaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-box {
            width: 850px;
            max-width: 100%;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            display: flex;
        }

        .left {
            width: 45%;
            background: linear-gradient(150deg, #172554, #2563eb);
            color: white;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left i {
            font-size: 55px;
        }

        .left h1 {
            font-size: 34px;
            font-weight: 700;
            margin-top: 20px;
        }

        .left p {
            color: #dbeafe;
            line-height: 1.7;
        }

        .right {
            width: 55%;
            padding: 45px;
        }

        .right h2 {
            color: #172554;
            font-weight: 700;
        }

        .form-control {
            height: 48px;
            border-radius: 9px;
        }

        .btn-register {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #1d4ed8;
        }

        @media(max-width: 700px) {

            .register-box {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="register-box">

    <div class="left">

        <i class="bi bi-shield-check"></i>

        <h1>SmartComplaint</h1>

        <p>
            Create your account and easily submit,
            track and manage complaints.
        </p>

    </div>


    <div class="right">

        <h2>Create Account</h2>

        <p class="text-muted mb-4">
            Register to access SmartComplaint.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter email"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm password"
                       required>

            </div>


            <button type="submit"
                    class="btn-register">

                <i class="bi bi-person-plus-fill"></i>
                Create Account

            </button>

        </form>


        <p class="text-center mt-4 text-muted">

            Already have an account?

            <a href="{% url 'login' %}"
               class="text-decoration-none fw-semibold">

                Login

            </a>

        </p>

    </div>

</div>

</body>

</html>
