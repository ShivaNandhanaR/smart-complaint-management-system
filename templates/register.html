<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

</head>

<body>

<h1>Create Account</h1>

{% if error %}

<p style="color:red;">
    {{ error }}
</p>

{% endif %}

<form method="POST">

    {% csrf_token %}

    <label>Username</label>

    <input
        type="text"
        name="username"
        required
    >

    <br><br>

    <label>Email</label>

    <input
        type="email"
        name="email"
        required
    >

    <br><br>

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
    >

    <br><br>

    <label>Confirm Password</label>

    <input
        type="password"
        name="confirm_password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<a href="/login/">
    Already have an account? Login
</a>

</body>

</html>
