<!DOCTYPE html>
<html>

<head>

    <title>Submit Complaint</title>

</head>

<body>

<h1>Submit Complaint</h1>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    <label>Category</label>

    <select name="category" required>

        <option value="">
            Select Category
        </option>

        <option value="Electrical">
            Electrical
        </option>

        <option value="Plumbing">
            Plumbing
        </option>

        <option value="Cleaning">
            Cleaning
        </option>

        <option value="WiFi">
            WiFi
        </option>

        <option value="Furniture">
            Furniture
        </option>

        <option value="Other">
            Other
        </option>

    </select>

    <br><br>

    <label>Location</label>

    <input
        type="text"
        name="location"
        required
    >

    <br><br>

    <label>Description</label>

    <br>

    <textarea
        name="description"
        rows="5"
        cols="50"
        required
    ></textarea>

    <br><br>

    <label>Priority</label>

    <select name="priority">

        <option value="Low">
            Low
        </option>

        <option value="Medium">
            Medium
        </option>

        <option value="High">
            High
        </option>

        <option value="Critical">
            Critical
        </option>

    </select>

    <br><br>

    <label>Upload Image</label>

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <br><br>

    <button type="submit">
        Submit Complaint
    </button>

</form>

<br>

<a href="/">
    Back to Dashboard
</a>

</body>

</html>
