<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SmartComplaint{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6fb;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1e293b;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #172554, #1e3a8a);
            padding: 25px 15px;
            color: white;
            z-index: 1000;
        }

        .brand {
            font-size: 21px;
            font-weight: 700;
            padding: 10px;
            margin-bottom: 30px;
        }

        .brand i {
            font-size: 27px;
            margin-right: 8px;
        }

        .nav-link {
            color: #dbeafe !important;
            padding: 13px 15px;
            margin-bottom: 6px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.12);
            color: white !important;
            transform: translateX(3px);
        }

        .nav-link i {
            margin-right: 10px;
        }

        .main {
            margin-left: 250px;
            min-height: 100vh;
            padding: 25px 35px;
        }

        .topbar {
            background: white;
            border-radius: 15px;
            padding: 17px 23px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .card-modern {
            background: white;
            border: none;
            border-radius: 17px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        }

        .stat-card {
            background: white;
            border-radius: 17px;
            padding: 22px;
            border: none;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .btn-main {
            background: #2563eb;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-main:hover {
            background: #1d4ed8;
            color: white;
        }

        .table {
            vertical-align: middle;
        }

        .table thead th {
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 1px solid #e2e8f0;
        }

        .table tbody td {
            padding: 16px 10px;
            border-color: #f1f5f9;
        }

        .badge-status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .form-control,
        .form-select {
            border-radius: 9px;
            padding: 11px 13px;
            border: 1px solid #dbe1ea;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 7px;
        }

        @media(max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .brand span,
            .nav-link span {
                display: none;
            }

            .main {
                margin-left: 70px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="brand">
        <i class="bi bi-shield-check"></i>
        <span>SmartComplaint</span>
    </div>

    <a href="{% url 'dashboard' %}" class="nav-link">
        <i class="bi bi-grid-fill"></i>
        <span>Dashboard</span>
    </a>

    <a href="{% url 'create_complaint' %}" class="nav-link">
        <i class="bi bi-plus-circle-fill"></i>
        <span>New Complaint</span>
    </a>

    <a href="{% url 'my_complaints' %}" class="nav-link">
        <i class="bi bi-file-earmark-text-fill"></i>
        <span>My Complaints</span>
    </a>

  

    <hr>

    <a href="{% url 'logout' %}" class="nav-link">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
    </a>

</div>


<div class="main">

    <div class="topbar d-flex justify-content-between align-items-center">

        <div>
            <h5 class="mb-1 fw-bold">
                {% block page_title %}SmartComplaint{% endblock %}
            </h5>

            <small class="text-muted">
                Complaint Management System
            </small>
        </div>

        <i class="bi bi-person-circle fs-3 text-secondary"></i>

    </div>


    {% block content %}
    {% endblock %}

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
